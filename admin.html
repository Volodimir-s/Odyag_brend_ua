<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмін-панель</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Тёмная тема (по умолчанию) */
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --danger-color: #ef4444;
      --border-color: #334155;
      --input-bg: #0f172a;
    }

    /* Светлая тема */
    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --danger-color: #dc2626;
      --border-color: #cbd5e1;
      --input-bg: #f8fafc;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .theme-toggle {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .theme-toggle:hover {
      border-color: var(--accent-color);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: background-color 0.2s, border-color 0.2s;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      color: var(--text-muted);
    }

    input, select {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    input[type="file"] {
      padding: 8px;
      cursor: pointer;
    }

    .sizes-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .size-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      user-select: none;
      transition: all 0.2s;
    }

    .size-btn input {
      display: none;
    }

    .size-btn.active {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .product-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      transition: background 0.2s, border-color 0.2s;
    }

    .product-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .product-img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
      background-color: var(--border-color);
    }

    .btn-delete {
      background-color: var(--danger-color);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
    }

    .btn-delete:hover {
      opacity: 0.9;
    }

    .filter-bar {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .form-grid, .filter-bar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h1 style="margin:0; font-size: 24px;">Адмін-панель</h1>
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌓 Змінити тему</button>
  </div>

  <div class="card">
    <h2 style="margin-top:0;">Додати новий товар</h2>
    <form id="addForm">
      <div class="form-grid">
        <div class="form-group">
          <label>Назва товару *</label>
          <input type="text" id="title" placeholder="наприклад, Кросівки Nike Air Force 1" required>
        </div>

        <div class="form-group">
          <label>Артикул (SKU)</label>
          <input type="text" id="sku" placeholder="наприклад, NK-1029">
        </div>

        <div class="form-group">
          <label>Категорія *</label>
          <select id="category" required onchange="updateSizesUI()">
            <option value="clothes">Одяг</option>
            <option value="shoes">Взуття</option>
            <option value="accessories">Аксесуари</option>
          </select>
        </div>

        <div class="form-group">
          <label>Бренд *</label>
          <select id="brand" required>
            <option value="Nike">Nike</option>
            <option value="Adidas">Adidas</option>
            <option value="Puma">Puma</option>
            <option value="Reebok">Reebok</option>
            <option value="New Balance">New Balance</option>
            <option value="Jordan">Jordan</option>
            <option value="Under Armour">Under Armour</option>
            <option value="Stone Island">Stone Island</option>
            <option value="The North Face">The North Face</option>
            <option value="Tommy Hilfiger">Tommy Hilfiger</option>
            <option value="Calvin Klein">Calvin Klein</option>
            <option value="Gucci">Gucci</option>
            <option value="Balenciaga">Balenciaga</option>
            <option value="Zara">Zara</option>
            <option value="Інше">Інше</option>
          </select>
        </div>

        <div class="form-group">
          <label>Ціна (грн) *</label>
          <input type="number" id="price" placeholder="1500" required>
        </div>

        <div class="form-group">
          <label>Фото з галереї *</label>
          <input type="file" id="imageFile" accept="image/*" required>
        </div>

        <div class="form-group full-width">
          <label>Посилання на покупку в Telegram *</label>
          <input type="url" id="tgLink" placeholder="https://t.me/your_manager" required>
        </div>

        <div class="form-group full-width">
          <label>Виберіть доступні розміри *</label>
          <div class="sizes-container" id="sizesContainer"></div>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnPublish">Опублікувати товар</button>
    </form>
  </div>

  <div class="card">
    <h2 style="margin-top:0;">Список товарів в базі (<span id="totalCount">0</span>)</h2>
    
    <div class="filter-bar">
      <input type="text" id="adminSearch" placeholder="Пошук за назвою/артикулом..." oninput="renderAdminList()">
      <select id="adminCatFilter" onchange="renderAdminList()">
        <option value="all">Усі категорії</option>
        <option value="clothes">Одяг</option>
        <option value="shoes">Взуття</option>
        <option value="accessories">Аксесуари</option>
      </select>
      <select id="adminSort" onchange="renderAdminList()">
        <option value="new">Спочатку нові</option>
        <option value="old">Спочатку старі</option>
      </select>
    </div>

    <div id="productList">Завантаження...</div>
  </div>
</div>

<script>
  // Логіка перемикання теми
  const savedTheme = localStorage.getItem('admin_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('admin_theme', newTheme);
  }

  const SUPABASE_URL = 'https://momhpeulxtwugqgcrvjs.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vbWhwZXVseHR3dWdxZ2NydmpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NDAxMTgsImV4cCI6MjEwNTIxNjExOH0.42x9SWmfP74egl8WEgItTX2_FHeazFrofoRa2ohNSok';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const CLOTHES_SIZES = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL', '4XL', 'One Size'];
  const SHOE_SIZES = [
    '35', '35.5', '36', '36.5', '37', '37.5', '38', '38.5', '39', '39.5',
    '40', '40.5', '41', '41.5', '42', '42.5', '43', '43.5', '44', '44.5',
    '45', '45.5', '46', '46.5'
  ];

  let rawProducts = [];

  function updateSizesUI() {
    const cat = document.getElementById('category').value;
    const container = document.getElementById('sizesContainer');
    container.innerHTML = '';

    const sizes = cat === 'shoes' ? SHOE_SIZES : CLOTHES_SIZES;

    sizes.forEach(size => {
      const label = document.createElement('label');
      label.className = 'size-btn';
      label.innerHTML = `
        <input type="checkbox" value="${size}" onchange="this.parentElement.classList.toggle('active', this.checked)">
        ${size}
      `;
      container.appendChild(label);
    });
  }

  async function loadAdminProducts() {
    const listDiv = document.getElementById('productList');
    try {
      const { data, error } = await supabaseClient
        .from('products')
        .select('*');

      if (error) throw error;
      rawProducts = data || [];
      renderAdminList();
    } catch (err) {
      console.error(err);
      listDiv.innerHTML = `<div style="color:var(--danger-color)">Помилка завантаження: ${err.message}</div>`;
    }
  }

  function renderAdminList() {
    const listDiv = document.getElementById('productList');
    const search = document.getElementById('adminSearch').value.toLowerCase();
    const cat = document.getElementById('adminCatFilter').value;
    const sort = document.getElementById('adminSort').value;

    let items = rawProducts.filter(p => {
      const title = p.title || p.name || 'Без назви';
      const sku = p.sku || '';
      const matchText = title.toLowerCase().includes(search) || sku.toLowerCase().includes(search);
      const matchCat = cat === 'all' || p.category === cat;
      return matchText && matchCat;
    });

    if (sort === 'old') {
      items.sort((a, b) => String(a.id).localeCompare(String(b.id)));
    } else {
      items.sort((a, b) => String(b.id).localeCompare(String(a.id)));
    }

    document.getElementById('totalCount').innerText = items.length;

    if (items.length === 0) {
      listDiv.innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 20px;">Немає товарів</div>';
      return;
    }

    listDiv.innerHTML = '';
    items.forEach(prod => {
      const div = document.createElement('div');
      div.className = 'product-item';
      
      const displayTitle = prod.title || prod.name || 'Товар без назви';
      const sizesStr = prod.sizes && Array.isArray(prod.sizes) ? prod.sizes.join(', ') : (prod.sizes || '—');

      let catName = prod.category;
      if (prod.category === 'clothes') catName = 'Одяг';
      else if (prod.category === 'shoes') catName = 'Взуття';
      else if (prod.category === 'accessories') catName = 'Аксесуари';

      div.innerHTML = `
        <div class="product-info">
          <img src="${prod.image_url || prod.image || 'https://via.placeholder.com/50'}" class="product-img" alt="">
          <div>
            <strong>${displayTitle}</strong>
            <div style="font-size:12px; color: var(--text-muted); margin-top:2px;">
              Категорія: ${catName || '—'} | Бренд: ${prod.brand || '—'} | Ціна: ${prod.price || 0} грн | Розміри: ${sizesStr}
            </div>
          </div>
        </div>
        <button class="btn-delete" onclick="deleteProduct('${prod.id}')">Видалити</button>
      `;
      listDiv.appendChild(div);
    });
  }

  async function deleteProduct(id) {
    if (!confirm('Ви дійсно хочете видалити цей товар?')) return;

    try {
      const { error } = await supabaseClient
        .from('products')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Помилка видалення: ' + error.message);
        console.error('Delete Error:', error);
      } else {
        alert('Товар видалено!');
        loadAdminProducts();
      }
    } catch (err) {
      alert('Помилка під час виконання операції');
      console.error(err);
    }
  }

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnPublish');
    btn.disabled = true;
    btn.innerText = 'Завантаження картинки...';

    const fileInput = document.getElementById('imageFile');
    const file = fileInput.files[0];

    if (!file) {
      alert('Виберіть зображення!');
      btn.disabled = false;
      btn.innerText = 'Опублікувати товар';
      return;
    }

    try {
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
      const filePath = `${fileName}`;

      btn.innerText = 'Завантаження зображення...';
      const { error: uploadError } = await supabaseClient.storage
        .from('products')
        .upload(filePath, file);

      if (uploadError) throw uploadError;

      const { data: publicUrlData } = supabaseClient.storage
        .from('products')
        .getPublicUrl(filePath);

      const imageUrl = publicUrlData.publicUrl;

      btn.innerText = 'Збереження товару...';
      const selectedSizes = Array.from(document.querySelectorAll('#sizesContainer input:checked')).map(cb => cb.value);

      const newProduct = {
        title: document.getElementById('title').value,
        sku: document.getElementById('sku').value,
        category: document.getElementById('category').value,
        brand: document.getElementById('brand').value,
        price: parseFloat(document.getElementById('price').value),
        image_url: imageUrl,
        tg_link: document.getElementById('tgLink').value,
        sizes: selectedSizes
      };

      const { error: insertError } = await supabaseClient
        .from('products')
        .insert([newProduct]);

      if (insertError) throw insertError;

      alert('Товар успішно додано!');
      document.getElementById('addForm').reset();
      updateSizesUI();
      loadAdminProducts();
    } catch (err) {
      alert('Помилка: ' + err.message);
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.innerText = 'Опублікувати товар';
    }
  });

  updateSizesUI();
  loadAdminProducts();
</script>
</body>
</html>
