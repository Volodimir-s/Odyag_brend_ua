<!DOCTYPE html>
<html lang="uk" data-theme="dark" data-lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Адмін-панель</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --danger-color: #ef4444;
      --border-color: #334155;
      --input-bg: #0f172a;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --danger-color: #dc2626;
      --border-color: #cbd5e1;
      --input-bg: #f8fafc;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s;
    }

    .control-btn:hover {
      border-color: var(--accent-color);
    }

    select.control-btn {
      appearance: none;
      padding-right: 28px;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      transition: background-color 0.2s, border-color 0.2s;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      color: var(--text-muted);
    }

    input, select {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    input[type="file"] {
      padding: 8px;
      cursor: pointer;
    }

    .sizes-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }

    .size-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      user-select: none;
      transition: all 0.2s;
    }

    .size-btn input {
      display: none;
    }

    .size-btn.active {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .product-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      transition: background 0.2s, border-color 0.2s;
      gap: 12px;
    }

    .product-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .product-img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
      background-color: var(--border-color);
      flex-shrink: 0;
    }

    .btn-delete {
      background-color: var(--danger-color);
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }

    .btn-delete:hover {
      opacity: 0.9;
    }

    .filter-bar {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .form-grid, .filter-bar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <h1 style="margin:0; font-size: 24px;" data-i18n="adminPanel">Адмін-панель</h1>
    <div class="header-controls">
      <!-- Перемикач мов зліва від теми -->
      <select id="langSelect" class="control-btn" onchange="changeLanguage(this.value)">
        <option value="uk">UA</option>
        <option value="ru">RU</option>
        <option value="en">EN</option>
      </select>
      <button class="control-btn" onclick="toggleTheme()" id="themeBtn">🌓</button>
    </div>
  </div>

  <div class="card">
    <h2 style="margin-top:0;" data-i18n="addProductTitle">Додати новий товар</h2>
    <form id="addForm">
      <div class="form-grid">
        <div class="form-group">
          <label data-i18n="labelTitle">Назва товару *</label>
          <input type="text" id="title" data-i18n-placeholder="placeholderTitle" required>
        </div>

        <div class="form-group">
          <label data-i18n="labelSku">Артикул (SKU)</label>
          <input type="text" id="sku" placeholder="наприклад, NK-1029">
        </div>

        <div class="form-group">
          <label data-i18n="labelCategory">Категорія *</label>
          <select id="category" required onchange="updateSizesUI()">
            <option value="clothes" data-i18n="catClothes">Одяг</option>
            <option value="shoes" data-i18n="catShoes">Взуття</option>
            <option value="accessories" data-i18n="catAccessories">Аксесуари</option>
          </select>
        </div>

        <div class="form-group">
          <label data-i18n="labelBrand">Бренд *</label>
          <select id="brand" required>
            <option value="Nike">Nike</option>
            <option value="Adidas">Adidas</option>
            <option value="Puma">Puma</option>
            <option value="Reebok">Reebok</option>
            <option value="New Balance">New Balance</option>
            <option value="Jordan">Jordan</option>
            <option value="Under Armour">Under Armour</option>
            <option value="Stone Island">Stone Island</option>
            <option value="The North Face">The North Face</option>
            <option value="Tommy Hilfiger">Tommy Hilfiger</option>
            <option value="Calvin Klein">Calvin Klein</option>
            <option value="Gucci">Gucci</option>
            <option value="Balenciaga">Balenciaga</option>
            <option value="Zara">Zara</option>
            <option value="Інше" data-i18n="brandOther">Інше</option>
          </select>
        </div>

        <div class="form-group">
          <label data-i18n="labelPrice">Ціна (грн) *</label>
          <input type="number" id="price" placeholder="1500" required>
        </div>

        <div class="form-group">
          <label data-i18n="labelImage">Фото з галереї *</label>
          <input type="file" id="imageFile" accept="image/*" required>
        </div>

        <div class="form-group full-width">
          <label data-i18n="labelTgLink">Посилання на покупку в Telegram *</label>
          <input type="url" id="tgLink" placeholder="https://t.me/your_manager" required>
        </div>

        <div class="form-group full-width">
          <label data-i18n="labelSizes">Виберіть доступні розміри *</label>
          <div class="sizes-container" id="sizesContainer"></div>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnPublish">Опублікувати товар</button>
    </form>
  </div>

  <div class="card">
    <h2 style="margin-top:0;"><span data-i18n="dbListTitle">Список товарів в базі</span> (<span id="totalCount">0</span>)</h2>
    
    <div class="filter-bar">
      <input type="text" id="adminSearch" data-i18n-placeholder="searchPlaceholder" oninput="renderAdminList()">
      <select id="adminCatFilter" onchange="renderAdminList()">
        <option value="all" data-i18n="filterAllCats">Усі категорії</option>
        <option value="clothes" data-i18n="catClothes">Одяг</option>
        <option value="shoes" data-i18n="catShoes">Взуття</option>
        <option value="accessories" data-i18n="catAccessories">Аксесуари</option>
      </select>
      <select id="adminSort" onchange="renderAdminList()">
        <option value="new" data-i18n="sortNew">Спочатку нові</option>
        <option value="old" data-i18n="sortOld">Спочатку старі</option>
      </select>
    </div>

    <div id="productList">Завантаження...</div>
  </div>
</div>

<script>
  // Словник перекладів
  const translations = {
    uk: {
      pageTitle: "Адмін-панель",
      adminPanel: "Адмін-панель",
      addProductTitle: "Додати новий товар",
      labelTitle: "Назва товару *",
      placeholderTitle: "наприклад, Кросівки Nike Air Force 1",
      labelSku: "Артикул (SKU)",
      labelCategory: "Категорія *",
      catClothes: "Одяг",
      catShoes: "Взуття",
      catAccessories: "Аксесуари",
      labelBrand: "Бренд *",
      brandOther: "Інше",
      labelPrice: "Ціна (грн) *",
      labelImage: "Фото з галереї *",
      labelTgLink: "Посилання на покупку в Telegram *",
      labelSizes: "Виберіть доступні розміри *",
      btnPublish: "Опублікувати товар",
      btnPublishingImg: "Завантаження картинки...",
      btnPublishingUpload: "Завантаження зображення...",
      btnPublishingSave: "Збереження товару...",
      dbListTitle: "Список товарів в базі",
      searchPlaceholder: "Пошук за назвою/артикулом...",
      filterAllCats: "Усі категорії",
      sortNew: "Спочатку нові",
      sortOld: "Спочатку старі",
      loading: "Завантаження...",
      noProducts: "Немає товарів",
      deleteBtn: "Видалити",
      confirmDelete: "Ви дійсно хочете видалити цей товар?",
      successDelete: "Товар видалено!",
      successAdd: "Товар успішно додано!",
      selectImgAlert: "Виберіть зображення!",
      errLoad: "Помилка завантаження: ",
      errDelete: "Помилка видалення: "
    },
    ru: {
      pageTitle: "Админ-панель",
      adminPanel: "Админ-панель",
      addProductTitle: "Добавить новый товар",
      labelTitle: "Название товара *",
      placeholderTitle: "например, Кроссовки Nike Air Force 1",
      labelSku: "Артикул (SKU)",
      labelCategory: "Категория *",
      catClothes: "Одежда",
      catShoes: "Обувь",
      catAccessories: "Аксессуары",
      labelBrand: "Бренд *",
      brandOther: "Другое",
      labelPrice: "Цена (грн) *",
      labelImage: "Фото из галереи *",
      labelTgLink: "Ссылка на покупку в Telegram *",
      labelSizes: "Выберите доступные размеры *",
      btnPublish: "Опубликовать товар",
      btnPublishingImg: "Загрузка картинки...",
      btnPublishingUpload: "Загрузка изображения...",
      btnPublishingSave: "Сохранение товара...",
      dbListTitle: "Список товаров в базе",
      searchPlaceholder: "Поиск по названию/артикулу...",
      filterAllCats: "Все категории",
      sortNew: "Сначала новые",
      sortOld: "Сначала старые",
      loading: "Загрузка...",
      noProducts: "Нет товаров",
      deleteBtn: "Удалить",
      confirmDelete: "Вы действительно хотите удалить этот товар?",
      successDelete: "Товар удален!",
      successAdd: "Товар успешно добавлен!",
      selectImgAlert: "Выберите изображение!",
      errLoad: "Ошибка загрузки: ",
      errDelete: "Ошибка удаления: "
    },
    en: {
      pageTitle: "Admin Panel",
      adminPanel: "Admin Panel",
      addProductTitle: "Add New Product",
      labelTitle: "Product Name *",
      placeholderTitle: "e.g., Nike Air Force 1 Sneakers",
      labelSku: "SKU",
      labelCategory: "Category *",
      catClothes: "Clothes",
      catShoes: "Shoes",
      catAccessories: "Accessories",
      labelBrand: "Brand *",
      brandOther: "Other",
      labelPrice: "Price (UAH) *",
      labelImage: "Image from Gallery *",
      labelTgLink: "Telegram Purchase Link *",
      labelSizes: "Select Available Sizes *",
      btnPublish: "Publish Product",
      btnPublishingImg: "Uploading image...",
      btnPublishingUpload: "Uploading image file...",
      btnPublishingSave: "Saving product...",
      dbListTitle: "Products in Database",
      searchPlaceholder: "Search by name/SKU...",
      filterAllCats: "All Categories",
      sortNew: "Newest First",
      sortOld: "Oldest First",
      loading: "Loading...",
      noProducts: "No products found",
      deleteBtn: "Delete",
      confirmDelete: "Are you sure you want to delete this product?",
      successDelete: "Product deleted!",
      successAdd: "Product successfully added!",
      selectImgAlert: "Please select an image!",
      errLoad: "Load error: ",
      errDelete: "Delete error: "
    }
  };

  // Ініціалізація теми та мови
  const savedTheme = localStorage.getItem('admin_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);

  const savedLang = localStorage.getItem('admin_lang') || 'uk';
  document.documentElement.setAttribute('data-lang', savedLang);
  document.getElementById('langSelect').value = savedLang;

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('admin_theme', newTheme);
  }

  function changeLanguage(lang) {
    document.documentElement.setAttribute('data-lang', lang);
    localStorage.setItem('admin_lang', lang);
    applyTranslations(lang);
    renderAdminList();
  }

  function applyTranslations(lang) {
    const t = translations[lang];
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (t[key]) el.innerText = t[key];
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if (t[key]) el.placeholder = t[key];
    });
    document.getElementById('pageTitle').innerText = t.pageTitle;
    document.getElementById('btnPublish').innerText = t.btnPublish;
  }

  const SUPABASE_URL = 'https://momhpeulxtwugqgcrvjs.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vbWhwZXVseHR3dWdxZ2NydmpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NDAxMTgsImV4cCI6MjEwNTIxNjExOH0.42x9SWmfP74egl8WEgItTX2_FHeazFrofoRa2ohNSok';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const CLOTHES_SIZES = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL', '4XL', 'One Size'];
  const SHOE_SIZES = [
    '35', '35.5', '36', '36.5', '37', '37.5', '38', '38.5', '39', '39.5',
    '40', '40.5', '41', '41.5', '42', '42.5', '43', '43.5', '44', '44.5',
    '45', '45.5', '46', '46.5'
  ];

  let rawProducts = [];

  function updateSizesUI() {
    const cat = document.getElementById('category').value;
    const container = document.getElementById('sizesContainer');
    container.innerHTML = '';

    const sizes = cat === 'shoes' ? SHOE_SIZES : CLOTHES_SIZES;

    sizes.forEach(size => {
      const label = document.createElement('label');
      label.className = 'size-btn';
      label.innerHTML = `
        <input type="checkbox" value="${size}" onchange="this.parentElement.classList.toggle('active', this.checked)">
        ${size}
      `;
      container.appendChild(label);
    });
  }

  async function loadAdminProducts() {
    const lang = localStorage.getItem('admin_lang') || 'uk';
    const t = translations[lang];
    const listDiv = document.getElementById('productList');
    
    try {
      const { data, error } = await supabaseClient
        .from('products')
        .select('*');

      if (error) throw error;
      rawProducts = data || [];
      renderAdminList();
    } catch (err) {
      console.error(err);
      listDiv.innerHTML = `<div style="color:var(--danger-color)">${t.errLoad}${err.message}</div>`;
    }
  }

  function renderAdminList() {
    const lang = localStorage.getItem('admin_lang') || 'uk';
    const t = translations[lang];
    const listDiv = document.getElementById('productList');
    const search = document.getElementById('adminSearch').value.toLowerCase();
    const cat = document.getElementById('adminCatFilter').value;
    const sort = document.getElementById('adminSort').value;

    let items = rawProducts.filter(p => {
      const title = p.title || p.name || 'Без назви';
      const sku = p.sku || '';
      const matchText = title.toLowerCase().includes(search) || sku.toLowerCase().includes(search);
      const matchCat = cat === 'all' || p.category === cat;
      return matchText && matchCat;
    });

    if (sort === 'old') {
      items.sort((a, b) => String(a.id).localeCompare(String(b.id)));
    } else {
      items.sort((a, b) => String(b.id).localeCompare(String(a.id)));
    }

    document.getElementById('totalCount').innerText = items.length;

    if (items.length === 0) {
      listDiv.innerHTML = `<div style="text-align:center; color: var(--text-muted); padding: 20px;">${t.noProducts}</div>`;
      return;
    }

    listDiv.innerHTML = '';
    items.forEach(prod => {
      const div = document.createElement('div');
      div.className = 'product-item';
      
      const displayTitle = prod.title || prod.name || 'Товар без назви';
      const sizesStr = prod.sizes && Array.isArray(prod.sizes) ? prod.sizes.join(', ') : (prod.sizes || '—');

      let catName = prod.category;
      if (prod.category === 'clothes') catName = t.catClothes;
      else if (prod.category === 'shoes') catName = t.catShoes;
      else if (prod.category === 'accessories') catName = t.catAccessories;

      div.innerHTML = `
        <div class="product-info">
          <img src="${prod.image_url || prod.image || 'https://via.placeholder.com/50'}" class="product-img" alt="">
          <div>
            <strong>${displayTitle}</strong>
            <div style="font-size:12px; color: var(--text-muted); margin-top:2px;">
              ${catName} | ${prod.brand || '—'} | ${prod.price || 0} UAH | ${sizesStr}
            </div>
          </div>
        </div>
        <button class="btn-delete" onclick="deleteProduct('${prod.id}')">${t.deleteBtn}</button>
      `;
      listDiv.appendChild(div);
    });
  }

  async function deleteProduct(id) {
    const lang = localStorage.getItem('admin_lang') || 'uk';
    const t = translations[lang];

    if (!confirm(t.confirmDelete)) return;

    try {
      const { error } = await supabaseClient
        .from('products')
        .delete()
        .eq('id', id);

      if (error) {
        alert(t.errDelete + error.message);
        console.error('Delete Error:', error);
      } else {
        alert(t.successDelete);
        loadAdminProducts();
      }
    } catch (err) {
      alert(t.errDelete);
      console.error(err);
    }
  }

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const lang = localStorage.getItem('admin_lang') || 'uk';
    const t = translations[lang];
    const btn = document.getElementById('btnPublish');
    
    btn.disabled = true;
    btn.innerText = t.btnPublishingImg;

    const fileInput = document.getElementById('imageFile');
    const file = fileInput.files[0];

    if (!file) {
      alert(t.selectImgAlert);
      btn.disabled = false;
      btn.innerText = t.btnPublish;
      return;
    }

    try {
      const fileExt = file.name.split('.').pop();
      const fileName = `${Date.now()}_${Math.random().toString(36).substring(2)}.${fileExt}`;
      const filePath = `${fileName}`;

      btn.innerText = t.btnPublishingUpload;
      const { error: uploadError } = await supabaseClient.storage
        .from('products')
        .upload(filePath, file);

      if (uploadError) throw uploadError;

      const { data: publicUrlData } = supabaseClient.storage
        .from('products')
        .getPublicUrl(filePath);

      const imageUrl = publicUrlData.publicUrl;

      btn.innerText = t.btnPublishingSave;
      const selectedSizes = Array.from(document.querySelectorAll('#sizesContainer input:checked')).map(cb => cb.value);

      const newProduct = {
        title: document.getElementById('title').value,
        sku: document.getElementById('sku').value,
        category: document.getElementById('category').value,
        brand: document.getElementById('brand').value,
        price: parseFloat(document.getElementById('price').value),
        image_url: imageUrl,
        tg_link: document.getElementById('tgLink').value,
        sizes: selectedSizes
      };

      const { error: insertError } = await supabaseClient
        .from('products')
        .insert([newProduct]);

      if (insertError) throw insertError;

      alert(t.successAdd);
      document.getElementById('addForm').reset();
      updateSizesUI();
      loadAdminProducts();
    } catch (err) {
      alert('Error: ' + err.message);
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.innerText = t.btnPublish;
    }
  });

  // Первинний запуск
  applyTranslations(savedLang);
  updateSizesUI();
  loadAdminProducts();
</script>
</body>
</html>
