<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель — Odyag_brend_ua</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --danger-color: #ef4444;
      --danger-hover: #dc2626;
      --border-color: #334155;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1, h2 {
      color: #38bdf8;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 30px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    label {
      font-size: 13px;
      color: var(--text-muted);
    }

    input, select {
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    .sizes-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 5px;
    }

    .size-checkbox-label {
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }

    .size-checkbox-label input {
      display: none;
    }

    .size-checkbox-label.active {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
    }

    .btn-submit {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      margin-top: 15px;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--accent-hover);
    }

    .product-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .product-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .product-img {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 6px;
    }

    .btn-delete {
      background-color: var(--danger-color);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-delete:hover {
      background-color: var(--danger-hover);
    }

    .filter-bar {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Панель управления товарами</h1>

  <!-- Форма добавления -->
  <div class="card">
    <h2>Добавить новый товар</h2>
    <form id="addForm">
      <div class="form-grid">
        <div class="form-group">
          <label>Название товара *</label>
          <input type="text" id="title" placeholder="например, Кроссовки Nike Air Force 1" required>
        </div>

        <div class="form-group">
          <label>Артикул (SKU)</label>
          <input type="text" id="sku" placeholder="например, NK-1029">
        </div>

        <div class="form-group">
          <label>Категория *</label>
          <select id="category" required onchange="updateSizesUI()">
            <option value="clothes">Одежда</option>
            <option value="shoes">Обувь</option>
            <option value="accessories">Аксессуары</option>
          </select>
        </div>

        <div class="form-group">
          <label>Бренд *</label>
          <select id="brand" required>
            <option value="Nike">Nike</option>
            <option value="Adidas">Adidas</option>
            <option value="Puma">Puma</option>
            <option value="Reebok">Reebok</option>
            <option value="New Balance">New Balance</option>
            <option value="Jordan">Jordan</option>
            <option value="Under Armour">Under Armour</option>
            <option value="Stone Island">Stone Island</option>
            <option value="The North Face">The North Face</option>
            <option value="Tommy Hilfiger">Tommy Hilfiger</option>
            <option value="Calvin Klein">Calvin Klein</option>
            <option value="Gucci">Gucci</option>
            <option value="Balenciaga">Balenciaga</option>
            <option value="Zara">Zara</option>
            <option value="Другое">Другое</option>
          </select>
        </div>

        <div class="form-group">
          <label>Цена (грн) *</label>
          <input type="number" id="price" placeholder="1500" required>
        </div>

        <div class="form-group">
          <label>Ссылка на изображение (URL) *</label>
          <input type="url" id="imageUrl" placeholder="https://..." required>
        </div>

        <div class="form-group full-width">
          <label>Ссылка на покупку в Telegram *</label>
          <input type="url" id="tgLink" placeholder="https://t.me/your_manager" required>
        </div>

        <div class="form-group full-width">
          <label>Выберите доступные размеры *</label>
          <div class="sizes-container" id="sizesContainer">
            <!-- Генерируется через JS -->
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="btnPublish">Опубликовать товар</button>
    </form>
  </div>

  <!-- Список товаров -->
  <div class="card">
    <h2>Список товаров в базе (<span id="totalCount">0</span>)</h2>
    
    <div class="filter-bar">
      <input type="text" id="adminSearch" placeholder="Поиск по названию/артикулу..." oninput="renderAdminList()">
      <select id="adminCatFilter" onchange="renderAdminList()">
        <option value="all">Все категории</option>
        <option value="clothes">Одежда</option>
        <option value="shoes">Обувь</option>
        <option value="accessories">Аксессуары</option>
      </select>
      <select id="adminSort" onchange="renderAdminList()">
        <option value="new">Сначала новые</option>
        <option value="old">Сначала старые</option>
      </select>
    </div>

    <div id="productList">Загрузка...</div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://momhpeulxtwugqgcrvjs.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vbWhwZXVseHR3dWdxZ2NydmpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NDAxMTgsImV4cCI6MjEwNTIxNjExOH0.42x9SWmfP74egl8WEgItTX2_FHeazFrofoRa2ohNSok';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const CLOTHES_SIZES = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', '3XL', '4XL', 'One Size'];
  const SHOE_SIZES = [
    '35', '35.5', '36', '36.5', '37', '37.5', '38', '38.5', '39', '39.5',
    '40', '40.5', '41', '41.5', '42', '42.5', '43', '43.5', '44', '44.5',
    '45', '45.5', '46', '46.5'
  ];

  let rawProducts = [];

  function updateSizesUI() {
    const cat = document.getElementById('category').value;
    const container = document.getElementById('sizesContainer');
    container.innerHTML = '';

    let sizes = cat === 'shoes' ? SHOE_SIZES : CLOTHES_SIZES;

    sizes.forEach(size => {
      const label = document.createElement('label');
      label.className = 'size-checkbox-label';
      label.innerHTML = `
        <input type="checkbox" value="${size}" onchange="this.parentElement.classList.toggle('active', this.checked)">
        ${size}
      `;
      container.appendChild(label);
    });
  }

  async function loadAdminProducts() {
    const listDiv = document.getElementById('productList');
    try {
      const { data, error } = await supabaseClient
        .from('products')
        .select('*')
        .order('id', { ascending: false });

      if (error) throw error;
      rawProducts = data || [];
      renderAdminList();
    } catch (err) {
      console.error(err);
      listDiv.innerHTML = `<div style="color:red">Ошибка загрузки: ${err.message}</div>`;
    }
  }

  function renderAdminList() {
    const listDiv = document.getElementById('productList');
    const search = document.getElementById('adminSearch').value.toLowerCase();
    const cat = document.getElementById('adminCatFilter').value;
    const sort = document.getElementById('adminSort').value;

    let items = rawProducts.filter(p => {
      const matchText = (p.title || '').toLowerCase().includes(search) || (p.sku || '').toLowerCase().includes(search);
      const matchCat = cat === 'all' || p.category === cat;
      return matchText && matchCat;
    });

    if (sort === 'old') {
      items.sort((a, b) => a.id - b.id);
    } else {
      items.sort((a, b) => b.id - a.id);
    }

    document.getElementById('totalCount').innerText = items.length;

    if (items.length === 0) {
      listDiv.innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 20px;">Нет товаров</div>';
      return;
    }

    listDiv.innerHTML = '';
    items.forEach(prod => {
      const div = document.createElement('div');
      div.className = 'product-item';
      
      const sizesStr = prod.sizes && Array.isArray(prod.sizes) ? prod.sizes.join(', ') : '—';

      div.innerHTML = `
        <div class="product-info">
          <img src="${prod.image_url || 'https://via.placeholder.com/50'}" class="product-img" alt="">
          <div>
            <strong>ID: ${prod.id} — ${prod.title}</strong>
            <div style="font-size:12px; color: var(--text-muted); margin-top:2px;">
              Категория: ${prod.category} | Бренд: ${prod.brand} | Цена: ${prod.price} грн | Размеры: ${sizesStr}
            </div>
          </div>
        </div>
        <button class="btn-delete" onclick="deleteProduct(${prod.id})">Удалить</button>
      `;
      listDiv.appendChild(div);
    });
  }

  async function deleteProduct(id) {
    if (!confirm(`Вы действительно хотите удалить товар с ID: ${id}?`)) return;

    try {
      const { error } = await supabaseClient
        .from('products')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Ошибка при удалении: ' + error.message);
        console.error('Supabase Delete Error:', error);
      } else {
        alert('Товар успешно удален!');
        loadAdminProducts();
      }
    } catch (err) {
      alert('Сбой при выполнении операции!');
      console.error(err);
    }
  }

  document.getElementById('addForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnPublish');
    btn.disabled = true;
    btn.innerText = 'Сохранение...';

    const selectedSizes = Array.from(document.querySelectorAll('#sizesContainer input:checked')).map(cb => cb.value);

    const newProduct = {
      title: document.getElementById('title').value,
      sku: document.getElementById('sku').value,
      category: document.getElementById('category').value,
      brand: document.getElementById('brand').value,
      price: parseFloat(document.getElementById('price').value),
      image_url: document.getElementById('imageUrl').value,
      tg_link: document.getElementById('tgLink').value,
      sizes: selectedSizes
    };

    try {
      const { error } = await supabaseClient
        .from('products')
        .insert([newProduct]);

      if (error) throw error;

      alert('Товар успешно добавлен!');
      document.getElementById('addForm').reset();
      updateSizesUI();
      loadAdminProducts();
    } catch (err) {
      alert('Ошибка при добавлении: ' + err.message);
      console.error(err);
    } finally {
      btn.disabled = false;
      btn.innerText = 'Опубликовать товар';
    }
  });

  updateSizesUI();
  loadAdminProducts();
</script>
</body>
</html>
