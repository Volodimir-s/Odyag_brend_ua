<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odyag_brend_ua</title>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --border-color: #334155;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }

    header {
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background-color: #0b1120;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      color: var(--accent-color);
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    input, select {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 25px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
    }

    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      background-color: #0b1120;
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 10px 0;
    }

    .card-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .card-price {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 15px;
    }

    .sizes-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .size-tag {
      background-color: #334155;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .btn-buy {
      margin-top: auto;
      background-color: var(--accent-color);
      color: #000;
      text-decoration: none;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn-buy:hover {
      background-color: var(--accent-hover);
      color: #fff;
    }

    .empty-msg {
      text-align: center;
      font-size: 18px;
      color: var(--text-muted);
      grid-column: 1 / -1;
      padding: 50px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>Odyag_brend_ua</h1>
  </header>

  <div class="container">
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Поиск по названию..." style="flex-grow: 1;">
      <select id="categorySelect">
        <option value="all">Все категории</option>
        <option value="clothes">Одежда</option>
        <option value="shoes">Обувь</option>
        <option value="accessories">Аксессуары</option>
      </select>
    </div>

    <div class="grid" id="productsGrid">
      <div class="empty-msg">Загрузка товаров...</div>
    </div>
  </div>

  <script>
    // Подключение к Supabase с рабочими ключами
    const SUPABASE_URL = 'https://momhpeulxtwugqgcrvjs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vbWhwZXVseHR3dWdxZ2NydmpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NDAxMTgsImV4cCI6MjEwNTIxNjExOH0.42x9SWmfP74egl8WEgItTX2_FHeazFrofoRa2ohNSok';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allProducts = [];

    // Функция загрузки товаров из БД
    async function loadProducts() {
      const grid = document.getElementById('productsGrid');
      
      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        allProducts = data || [];
        renderProducts(allProducts);

      } catch (err) {
        console.error('Ошибка загрузки товаров:', err);
        grid.innerHTML = `<div class="empty-msg">Ошибка загрузки товаров: ${err.message}</div>`;
      }
    }

    // Функция отрисовки товаров
    function renderProducts(products) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      if (products.length === 0) {
        grid.innerHTML = '<div class="empty-msg">Товары не найдены</div>';
        return;
      }

      products.forEach(p => {
        const sizesHtml = p.sizes && Array.isArray(p.sizes) 
          ? p.sizes.map(s => `<span class="size-tag">${s}</span>`).join('') 
          : '';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${p.image_url || 'https://via.placeholder.com/300'}" alt="${p.title}">
          <div class="card-body">
            <h3 class="card-title">${p.title}</h3>
            <div class="card-meta">Бренд: ${p.brand || '—'} | Категория: ${p.category || '—'}</div>
            <div class="card-price">${p.price} грн</div>
            ${sizesHtml ? `<div class="sizes-list">${sizesHtml}</div>` : ''}
            <a href="${p.tg_link || '#'}" target="_blank" class="btn-buy">Купить в Telegram</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Фильтрация и поиск
    document.getElementById('searchInput').addEventListener('input', filterProducts);
    document.getElementById('categorySelect').addEventListener('change', filterProducts);

    function filterProducts() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categorySelect').value;

      const filtered = allProducts.filter(p => {
        const matchTitle = (p.title || '').toLowerCase().includes(search) || (p.sku || '').toLowerCase().includes(search);
        const matchCategory = category === 'all' || p.category === category;
        return matchTitle && matchCategory;
      });

      renderProducts(filtered);
    }

    // Старт
    loadProducts();
  </script>
</body>
</html>
