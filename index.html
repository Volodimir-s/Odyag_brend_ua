<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odyag_brend_ua</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --border-color: #334155;
    }

    body.light-theme {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --accent-color: #0284c7;
      --border-color: #e2e8f0;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--card-bg);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      color: var(--accent-color);
    }

    .header-btns {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action:hover {
      background-color: var(--border-color);
    }

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    input, select {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      box-sizing: border-box;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--accent-color);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      background-color: #0b1120;
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 8px 0;
    }

    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .card-price {
      font-size: 20px;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 12px;
    }

    .sizes-list {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .size-tag {
      background-color: var(--border-color);
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 4px;
    }

    .btn-buy {
      margin-top: auto;
      background-color: var(--accent-color);
      color: #000;
      text-decoration: none;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      border: none;
    }

    /* Модальные окна */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .close-btn {
      cursor: pointer;
      font-size: 20px;
      color: var(--text-muted);
    }

    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border-color);
    }

    .filter-section:last-of-type {
      border-bottom: none;
    }

    .filter-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-color);
    }

    .price-inputs {
      display: flex;
      gap: 10px;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      grid-column: 1 / -1;
      padding: 40px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Odyag_brend_ua</h1>
    <div class="header-btns">
      <button class="btn-action" id="btnFilters" onclick="openFilters()">🔍 Фільтри</button>
      <button class="btn-action" id="btnSettings" onclick="openSettings()">⚙️ Налаштування</button>
    </div>
  </header>

  <div class="container">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Пошук...">
    </div>

    <div class="grid" id="productsGrid">
      <div class="empty-msg" id="msgLoading">Завантаження...</div>
    </div>
  </div>

  <!-- Модальное окно фильтров (По разделам) -->
  <div class="modal" id="filterModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="titleFilter">Фільтри товарів</span>
        <span class="close-btn" onclick="closeFilters()">&times;</span>
      </div>
      
      <!-- Раздел 1: Категория -->
      <div class="filter-section">
        <span class="filter-label" id="secCat">Категорія:</span>
        <select id="categorySelect">
          <option value="all" id="optAllCat">Усі категорії</option>
          <option value="clothes" id="optClothes">Одяг</option>
          <option value="shoes" id="optShoes">Взуття</option>
          <option value="accessories" id="optAcc">Аксесуари</option>
        </select>
      </div>

      <!-- Раздел 2: Бренд -->
      <div class="filter-section">
        <span class="filter-label" id="lblBrand">Бренд:</span>
        <input type="text" id="brandInput" placeholder="Nike, Adidas...">
      </div>

      <!-- Раздел 3: Диапазон цен -->
      <div class="filter-section">
        <span class="filter-label" id="secPrice">Ціна:</span>
        <div class="price-inputs">
          <input type="number" id="priceFrom" placeholder="Від">
          <input type="number" id="priceTo" placeholder="До">
        </div>
      </div>

      <!-- Раздел 4: Размер -->
      <div class="filter-section">
        <span class="filter-label" id="secSize">Розмір:</span>
        <input type="text" id="sizeInput" placeholder="S, M, L, 42...">
      </div>

      <!-- Раздел 5: Сортировка -->
      <div class="filter-section">
        <span class="filter-label" id="lblSort">Сортування:</span>
        <select id="sortSelect">
          <option value="default" id="optNew">Спочатку нові</option>
          <option value="price_asc" id="optAsc">Від дешевих до дорогих</option>
          <option value="price_desc" id="optDesc">Від дорогих до дешевих</option>
        </select>
      </div>

      <button class="btn-buy" id="btnApplyFilter" onclick="applyModalFilters()" style="cursor: pointer; margin-top: 5px;">Застосувати</button>
    </div>
  </div>

  <!-- Модальное окно настроек -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="titleSettings">Налаштування сайту</span>
        <span class="close-btn" onclick="closeSettings()">&times;</span>
      </div>
      
      <div class="setting-item">
        <span id="lblLang">Мова:</span>
        <select id="langSelect" onchange="changeLanguage()" style="width: auto;">
          <option value="uk">Українська</option>
          <option value="ru">Русский</option>
        </select>
      </div>

      <div class="setting-item">
        <span id="lblTheme">Тема:</span>
        <select id="themeSelect" onchange="toggleTheme()" style="width: auto;">
          <option value="dark" id="optDark">Темна</option>
          <option value="light" id="optLight">Світла</option>
        </select>
      </div>

      <div class="setting-item">
        <span id="lblCurrency">Валюта:</span>
        <select id="currencySelect" onchange="filterAndRender()" style="width: auto;">
          <option value="UAH">грн (UAH)</option>
          <option value="USD">$ (USD)</option>
        </select>
      </div>

      <button class="btn-buy" id="btnCloseSettings" onclick="closeSettings()" style="cursor: pointer;">Закрити</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://momhpeulxtwugqgcrvjs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vbWhwZXVseHR3dWdxZ2NydmpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NDAxMTgsImV4cCI6MjEwNTIxNjExOH0.42x9SWmfP74egl8WEgItTX2_FHeazFrofoRa2ohNSok';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let allProducts = [];

    const translations = {
      uk: {
        btnFilters: '🔍 Фільтри',
        btnSettings: '⚙️ Налаштування',
        searchPlaceholder: 'Пошук за назвою...',
        titleFilter: 'Фільтри товарів',
        secCat: 'Категорія:',
        optAllCat: 'Усі категорії',
        optClothes: 'Одяг',
        optShoes: 'Взуття',
        optAcc: 'Аксесуари',
        lblBrand: 'Бренд:',
        secPrice: 'Ціна:',
        pFrom: 'Від',
        pTo: 'До',
        secSize: 'Розмір:',
        lblSort: 'Сортування:',
        optNew: 'Спочатку нові',
        optAsc: 'Від дешевих до дорогих',
        optDesc: 'Від дорогих до дешевих',
        btnApplyFilter: 'Застосувати',
        titleSettings: 'Налаштування сайту',
        lblLang: 'Мова:',
        lblTheme: 'Тема:',
        optDark: 'Темна',
        optLight: 'Світла',
        lblCurrency: 'Валюта:',
        btnCloseSettings: 'Закрити',
        buyBtn: 'Купити в Telegram',
        brandLbl: 'Бренд',
        catLbl: 'Категорія',
        emptyMsg: 'Товари не знайдені'
      },
      ru: {
        btnFilters: '🔍 Фильтры',
        btnSettings: '⚙️ Настройки',
        searchPlaceholder: 'Поиск по названию...',
        titleFilter: 'Фильтры товаров',
        secCat: 'Категория:',
        optAllCat: 'Все категории',
        optClothes: 'Одежда',
        optShoes: 'Обувь',
        optAcc: 'Аксессуары',
        lblBrand: 'Бренд:',
        secPrice: 'Цена:',
        pFrom: 'От',
        pTo: 'До',
        secSize: 'Размер:',
        lblSort: 'Сортировка:',
        optNew: 'Сначала новые',
        optAsc: 'От дешевых к дорогим',
        optDesc: 'От дорогих к дешевым',
        btnApplyFilter: 'Применить',
        titleSettings: 'Настройки сайта',
        lblLang: 'Язык:',
        lblTheme: 'Тема:',
        optDark: 'Тёмная',
        optLight: 'Светлая',
        lblCurrency: 'Валюта:',
        btnCloseSettings: 'Закрыть',
        buyBtn: 'Купить в Telegram',
        brandLbl: 'Бренд',
        catLbl: 'Категория',
        emptyMsg: 'Товары не найдены'
      }
    };

    async function loadProducts() {
      const grid = document.getElementById('productsGrid');
      try {
        const { data, error } = await supabaseClient
          .from('products')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;
        allProducts = data || [];
        filterAndRender();
      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div class="empty-msg">Помилка завантаження: ${err.message}</div>`;
      }
    }

    function filterAndRender() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const category = document.getElementById('categorySelect').value;
      const brandFilter = document.getElementById('brandInput').value.toLowerCase();
      const pFrom = parseFloat(document.getElementById('priceFrom').value) || 0;
      const pTo = parseFloat(document.getElementById('priceTo').value) || Infinity;
      const sizeFilter = document.getElementById('sizeInput').value.toLowerCase();
      const sort = document.getElementById('sortSelect').value;

      let filtered = allProducts.filter(p => {
        const matchTitle = (p.title || '').toLowerCase().includes(search) || (p.sku || '').toLowerCase().includes(search);
        const matchCategory = category === 'all' || p.category === category;
        const matchBrand = !brandFilter || (p.brand || '').toLowerCase().includes(brandFilter);
        
        const price = parseFloat(p.price) || 0;
        const matchPrice = price >= pFrom && price <= pTo;

        const matchSize = !sizeFilter || (p.sizes && Array.isArray(p.sizes) && p.sizes.some(s => s.toLowerCase().includes(sizeFilter)));

        return matchTitle && matchCategory && matchBrand && matchPrice && matchSize;
      });

      if (sort === 'price_asc') filtered.sort((a, b) => Number(a.price) - Number(b.price));
      if (sort === 'price_desc') filtered.sort((a, b) => Number(b.price) - Number(a.price));

      renderProducts(filtered);
    }

    function renderProducts(products) {
      const grid = document.getElementById('productsGrid');
      const currency = document.getElementById('currencySelect').value === 'USD' ? '$' : 'грн';
      const lang = document.getElementById('langSelect').value;
      const t = translations[lang];

      grid.innerHTML = '';

      if (products.length === 0) {
        grid.innerHTML = `<div class="empty-msg">${t.emptyMsg}</div>`;
        return;
      }

      products.forEach(p => {
        const sizesHtml = p.sizes && Array.isArray(p.sizes) 
          ? p.sizes.map(s => `<span class="size-tag">${s}</span>`).join('') 
          : '';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${p.image_url || 'https://via.placeholder.com/300'}" alt="${p.title}">
          <div class="card-body">
            <h3 class="card-title">${p.title}</h3>
            <div class="card-meta">${t.brandLbl}: ${p.brand || '—'} | ${t.catLbl}: ${p.category || '—'}</div>
            <div class="card-price">${p.price} ${currency}</div>
            ${sizesHtml ? `<div class="sizes-list">${sizesHtml}</div>` : ''}
            <a href="${p.tg_link || '#'}" target="_blank" class="btn-buy">${t.buyBtn}</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function changeLanguage() {
      const lang = document.getElementById('langSelect').value;
      const t = translations[lang];

      document.getElementById('btnFilters').innerText = t.btnFilters;
      document.getElementById('btnSettings').innerText = t.btnSettings;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('titleFilter').innerText = t.titleFilter;
      document.getElementById('secCat').innerText = t.secCat;
      document.getElementById('optAllCat').innerText = t.optAllCat;
      document.getElementById('optClothes').innerText = t.optClothes;
      document.getElementById('optShoes').innerText = t.optShoes;
      document.getElementById('optAcc').innerText = t.optAcc;
      document.getElementById('lblBrand').innerText = t.lblBrand;
      document.getElementById('secPrice').innerText = t.secPrice;
      document.getElementById('priceFrom').placeholder = t.pFrom;
      document.getElementById('priceTo').placeholder = t.pTo;
      document.getElementById('secSize').innerText = t.secSize;
      document.getElementById('lblSort').innerText = t.lblSort;
      document.getElementById('optNew').innerText = t.optNew;
      document.getElementById('optAsc').innerText = t.optAsc;
      document.getElementById('optDesc').innerText = t.optDesc;
      document.getElementById('btnApplyFilter').innerText = t.btnApplyFilter;
      document.getElementById('titleSettings').innerText = t.titleSettings;
      document.getElementById('lblLang').innerText = t.lblLang;
      document.getElementById('lblTheme').innerText = t.lblTheme;
      document.getElementById('optDark').innerText = t.optDark;
      document.getElementById('optLight').innerText = t.optLight;
      document.getElementById('lblCurrency').innerText = t.lblCurrency;
      document.getElementById('btnCloseSettings').innerText = t.btnCloseSettings;

      filterAndRender();
    }

    document.getElementById('searchInput').addEventListener('input', filterAndRender);

    function openFilters() { document.getElementById('filterModal').style.display = 'flex'; }
    function closeFilters() { document.getElementById('filterModal').style.display = 'none'; }
    function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }
    function applyModalFilters() { filterAndRender(); closeFilters(); }

    function toggleTheme() {
      const theme = document.getElementById('themeSelect').value;
      if (theme === 'light') {
        document.body.classList.add('light-theme');
      } else {
        document.body.classList.remove('light-theme');
      }
    }

    loadProducts();
  </script>
</body>
</html>
