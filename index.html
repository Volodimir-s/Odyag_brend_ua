<!DOCTYPE html>
<html lang="uk" data-theme="dark" data-lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Одяг Premium Взуття</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --border-color: #334155;
      --input-bg: #0f172a;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --accent-color: #0284c7;
      --accent-hover: #0369a1;
      --border-color: #cbd5e1;
      --input-bg: #f8fafc;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: var(--text-color);
      text-decoration: none;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, border-color 0.2s;
    }

    .control-btn:hover {
      border-color: var(--accent-color);
    }

    select.control-btn {
      appearance: none;
      padding-right: 28px;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 8px center;
      background-size: 16px;
    }

    .filter-section {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 16px;
    }

    input, select {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .product-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
    }

    .product-img-wrap {
      width: 100%;
      height: 240px;
      background-color: var(--input-bg);
      position: relative;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .product-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .product-info-row {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .product-price {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
      margin: 12px 0;
    }

    .sizes-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 16px;
    }

    .size-tag {
      font-size: 11px;
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-muted);
    }

    .btn-buy {
      display: block;
      text-align: center;
      background-color: var(--accent-color);
      color: #fff;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      margin-top: auto;
      transition: background 0.2s;
    }

    .btn-buy:hover {
      background-color: var(--accent-hover);
    }

    @media (max-width: 768px) {
      .filter-section {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    <a href="#" class="logo">Одяг Premium Взуття</a>
    <div class="header-controls">
      <select id="langSelect" class="control-btn" onchange="changeLanguage(this.value)">
        <option value="uk">UA</option>
        <option value="ru">RU</option>
        <option value="en">EN</option>
      </select>
      <button class="control-btn" onclick="toggleTheme()" id="themeBtn">🌓</button>
    </div>
  </div>

  <div class="filter-section">
    <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" oninput="renderProducts()" placeholder="Пошук за назвою...">
    <select id="catFilter" onchange="renderProducts()">
      <option value="all" data-i18n="filterAllCats">Усі категорії</option>
      <option value="clothes" data-i18n="catClothes">Одяг</option>
      <option value="shoes" data-i18n="catShoes">Взуття</option>
      <option value="accessories" data-i18n="catAccessories">Аксесуари</option>
    </select>
    <select id="sortFilter" onchange="renderProducts()">
      <option value="new" data-i18n="sortNew">Спочатку нові</option>
      <option value="old" data-i18n="sortOld">Спочатку старі</option>
    </select>
  </div>

  <div id="productsContainer" class="products-grid">
    <div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;" data-i18n="loading">Завантаження...</div>
  </div>
</div>

<script>
  const translations = {
    uk: {
      pageTitle: "Одяг Premium Взуття",
      searchPlaceholder: "Пошук за назвою або артикулом...",
      filterAllCats: "Усі категорії",
      catClothes: "Одяг",
      catShoes: "Взуття",
      catAccessories: "Аксесуари",
      sortNew: "Спочатку нові",
      sortOld: "Спочатку старі",
      loading: "Завантаження...",
      noProducts: "Товари не знайдені",
      brand: "Бренд:",
      sizes: "Розміри:",
      buyBtn: "Купити в Telegram"
    },
    ru: {
      pageTitle: "Одяг Premium Взуття",
      searchPlaceholder: "Поиск по названию или артикулу...",
      filterAllCats: "Все категории",
      catClothes: "Одежда",
      catShoes: "Обувь",
      catAccessories: "Аксессуары",
      sortNew: "Сначала новые",
      sortOld: "Сначала старые",
      loading: "Загрузка...",
      noProducts: "Товары не найдены",
      brand: "Бренд:",
      sizes: "Размеры:",
      buyBtn: "Купить в Telegram"
    },
    en: {
      pageTitle: "Одяг Premium Взуття",
      searchPlaceholder: "Search by name or SKU...",
      filterAllCats: "All Categories",
      catClothes: "Clothes",
      catShoes: "Shoes",
      catAccessories: "Accessories",
      sortNew: "Newest First",
      sortOld: "Oldest First",
      loading: "Loading...",
      noProducts: "No products found",
      brand: "Brand:",
      sizes: "Sizes:",
      buyBtn: "Buy via Telegram"
    }
  };

  const savedTheme = localStorage.getItem('client_theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);

  const savedLang = localStorage.getItem('client_lang') || 'uk';
  document.documentElement.setAttribute('data-lang', savedLang);
  document.getElementById('langSelect').value = savedLang;

  function toggleTheme() {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    localStorage.setItem('client_theme', newTheme);
  }

  function changeLanguage(lang) {
    document.documentElement.setAttribute('data-lang', lang);
    localStorage.setItem('client_lang', lang);
    applyTranslations(lang);
    renderProducts();
  }

  function applyTranslations(lang) {
    const t = translations[lang];
    document.getElementById('pageTitle').innerText = t.pageTitle;
    document.getElementById('searchInput').placeholder = t.searchPlaceholder;
    
    // Переводим опции селектов категорий и сортировки динамически
    document.querySelector('[value="all"]').innerText = t.filterAllCats;
    document.querySelector('[value="clothes"]').innerText = t.catClothes;
    document.querySelector('[value="shoes"]').innerText = t.catShoes;
    document.querySelector('[value="accessories"]').innerText = t.catAccessories;
    document.querySelector('[value="new"]').innerText = t.sortNew;
    document.querySelector('[value="old"]').innerText = t.sortOld;
  }

  const SUPABASE_URL = 'https://momhpeulxtwugqgcrvjs.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vbWhwZXVseHR3dWdxZ2NydmpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NDAxMTgsImV4cCI6MjEwNTIxNjExOH0.42x9SWmfP74egl8WEgItTX2_FHeazFrofoRa2ohNSok';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let rawProducts = [];

  async function loadProducts() {
    try {
      const { data, error } = await supabaseClient
        .from('products')
        .select('*');

      if (error) throw error;
      rawProducts = data || [];
      renderProducts();
    } catch (err) {
      console.error(err);
      document.getElementById('productsContainer').innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--danger-color);">Помилка завантаження товарів</div>`;
    }
  }

  function renderProducts() {
    const lang = localStorage.getItem('client_lang') || 'uk';
    const t = translations[lang];
    const container = document.getElementById('productsContainer');
    const search = document.getElementById('searchInput').value.toLowerCase();
    const cat = document.getElementById('catFilter').value;
    const sort = document.getElementById('sortFilter').value;

    let items = rawProducts.filter(p => {
      const title = (p.title || p.name || '').toLowerCase();
      const sku = (p.sku || '').toLowerCase();
      const matchText = title.includes(search) || sku.includes(search);
      const matchCat = cat === 'all' || p.category === cat;
      return matchText && matchCat;
    });

    if (sort === 'old') {
      items.sort((a, b) => String(a.id).localeCompare(String(b.id)));
    } else {
      items.sort((a, b) => String(b.id).localeCompare(String(a.id)));
    }

    if (items.length === 0) {
      container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">${t.noProducts}</div>`;
      return;
    }

    container.innerHTML = '';
    items.forEach(prod => {
      const card = document.createElement('div');
      card.className = 'product-card';

      const title = prod.title || prod.name || 'Товар';
      const price = prod.price || 0;
      const imageUrl = prod.image_url || prod.image || 'https://via.placeholder.com/300';
      const brand = prod.brand || '—';
      const tgLink = prod.tg_link || '#';
      
      let sizesHtml = '';
      if (prod.sizes && Array.isArray(prod.sizes) && prod.sizes.length > 0) {
        sizesHtml = `<div class="sizes-list">` + prod.sizes.map(s => `<span class="size-tag">${s}</span>`).join('') + `</div>`;
      }

      card.innerHTML = `
        <div class="product-img-wrap">
          <img src="${imageUrl}" class="product-img" alt="${title}">
        </div>
        <div class="product-content">
          <div class="product-title">${title}</div>
          <div class="product-info-row">${t.brand} <strong>${brand}</strong></div>
          <div class="product-price">${price} UAH</div>
          ${sizesHtml}
          <a href="${tgLink}" target="_blank" class="btn-buy">${t.buyBtn}</a>
        </div>
      `;
      container.appendChild(card);
    });
  }

  applyTranslations(savedLang);
  loadProducts();
</script>
</body>
</html>
