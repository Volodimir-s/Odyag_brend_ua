<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odyag_brend_ua — Магазин</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --input-bg: #0f172a;
            --grid-cols: repeat(auto-fill, minmax(230px, 1fr));
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --accent-color: #0284c7;
            --border-color: #e2e8f0;
            --input-bg: #f1f5f9;
        }

        body { font-family: Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; transition: background 0.3s, color 0.3s; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color); gap: 10px; flex-wrap: wrap; }
        h1 { margin: 0; color: var(--accent-color); font-size: 1.5rem; }

        .header-actions { display: flex; gap: 8px; align-items: center; }
        .settings-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .settings-btn:hover { border-color: var(--accent-color); }

        /* Модальные окна */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 340px; border: 1px solid var(--border-color); position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-close { position: absolute; top: 10px; right: 15px; cursor: pointer; font-size: 1.2rem; font-weight: bold; }

        /* Поля фильтров в модалке */
        .filter-group { display: flex; flex-direction: column; gap: 12px; margin-top: 15px; }
        .filter-group label { font-size: 0.85rem; font-weight: bold; opacity: 0.9; }
        .filter-group input, .filter-group select { padding: 9px; border-radius: 6px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-color); font-size: 0.9rem; }
        .price-group { display: flex; gap: 8px; }
        .price-group input { flex: 1; }

        /* Кнопка сброса внутри фильтра */
        .btn-reset { background: #ef4444; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }

        /* Каталог */
        .catalog { display: grid; grid-template-columns: var(--grid-cols); gap: 20px; }
        .card { background: var(--card-bg); border-radius: 10px; border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .card img { width: 100%; height: 240px; object-fit: cover; }
        .card-body { padding: 12px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-weight: bold; margin-bottom: 6px; font-size: 1rem; }
        .card-sku { font-size: 0.75rem; color: #94a3b8; margin-bottom: 6px; }
        .card-price { color: var(--accent-color); font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
        .card-info { font-size: 0.8rem; opacity: 0.8; margin-bottom: 4px; }
        
        .btn-buy { margin-top: auto; text-align: center; background: #24a1de; color: #fff; text-decoration: none; padding: 8px; border-radius: 6px; font-weight: bold; }
        
        /* Избранное */
        .fav-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); border: none; color: #fff; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 1rem; display: flex; justify-content: center; align-items: center; }
        .fav-btn.active { color: #ef4444; }

        /* Ползунок темы */
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-color); }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>

    <header>
        <h1>Odyag_brend_ua</h1>
        <div class="header-actions">
            <button class="settings-btn" onclick="openFilters()">🔍 Фильтры</button>
            <button class="settings-btn" onclick="toggleFavFilter()" id="favToggleBtn">❤️ Избранное (0)</button>
            <button class="settings-btn" onclick="openSettings()">⚙️ Настройки</button>
        </div>
    </header>

    <!-- Каталог -->
    <main class="catalog" id="productsContainer">
        <p>Загрузка товаров...</p>
    </main>

    <!-- Модальная вкладка ФИЛЬТРОВ -->
    <div class="modal" id="filtersModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeFilters()">&times;</span>
            <h3 id="lblFilterTitle">Фильтр товаров</h3>
            
            <div class="filter-group">
                <div>
                    <label>Поиск:</label>
                    <input type="text" id="searchSkutitle" placeholder="Название или артикул..." oninput="loadProducts()">
                </div>

                <div>
                    <label>Тип одежды:</label>
                    <select id="typeFilter" onchange="updateSubtypeFilter(); loadProducts();">
                        <option value="all">Все типы</option>
                        <option value="clothes">Одежда</option>
                        <option value="shoes">Обувь</option>
                        <option value="accessories">Аксессуары</option>
                    </select>
                </div>

                <div>
                    <label>Подкатегория:</label>
                    <select id="subtypeFilter" onchange="loadProducts()">
                        <option value="all">Все подкатегории</option>
                    </select>
                </div>

                <div>
                    <label>Бренд:</label>
                    <select id="brandFilter" onchange="loadProducts()">
                        <option value="all">Все бренды</option>
                        <option value="Nike">Nike</option>
                        <option value="Adidas">Adidas</option>
                        <option value="Puma">Puma</option>
                        <option value="Stone Island">Stone Island</option>
                        <option value="Jordan">Jordan</option>
                    </select>
                </div>

                <div>
                    <label>Размер:</label>
                    <input type="text" id="sizeFilter" placeholder="S, M, 42..." oninput="loadProducts()">
                </div>

                <div>
                    <label>Бюджет (грн):</label>
                    <div class="price-group">
                        <input type="number" id="priceFrom" placeholder="От" oninput="loadProducts()">
                        <input type="number" id="priceTo" placeholder="До" oninput="loadProducts()">
                    </div>
                </div>

                <button class="btn-reset" onclick="resetFilters()">Сбросить фильтры</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно НАСТРОЕК -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeSettings()">&times;</span>
            <h3 id="setHeading">Настройки</h3>
            
            <div style="margin-bottom: 15px;">
                <label id="lblLang">Язык интерфейса:</label><br>
                <select id="langSelect" onchange="changeLanguage()" style="width: 100%; margin-top: 5px;">
                    <option value="ru">Русский</option>
                    <option value="uk">Українська</option>
                    <option value="en">English</option>
                </select>
            </div>

            <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                <span id="lblTheme">Темная тема:</span>
                <label class="switch">
                    <input type="checkbox" id="themeToggle" onchange="toggleTheme()" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div style="margin-bottom: 15px;">
                <label id="lblCurrency">Валюта цен:</label><br>
                <select id="currencySelect" onchange="loadProducts()" style="width: 100%; margin-top: 5px;">
                    <option value="UAH">UAH (₴)</option>
                    <option value="USD">USD ($)</option>
                    <option value="EUR">EUR (€)</option>
                </select>
            </div>

            <div style="margin-bottom: 15px;">
                <label id="lblGrid">Сетка отображения:</label><br>
                <select id="gridSelect" onchange="changeGrid()" style="width: 100%; margin-top: 5px;">
                    <option value="auto">Стандартная</option>
                    <option value="large">Крупная (2 в ряд)</option>
                    <option value="small">Компактная (4 в ряд)</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://momhpeulxtwugqgcrvjs.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_K4Ds2nST2VYbNFodcp1FLA__uX00';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let favorites = JSON.parse(localStorage.getItem('favs') || '[]');
        let showOnlyFavs = false;

        const translations = {
            ru: { heading: "Настройки", filterTitle: "Фильтр товаров", lang: "Язык:", theme: "Темная тема:", curr: "Валюта:", grid: "Сетка:", buy: "Купить в Telegram", empty: "Товары не найдены" },
            uk: { heading: "Налаштування", filterTitle: "Фільтр товарів", lang: "Мова:", theme: "Темна тема:", curr: "Валюта:", grid: "Сітка:", buy: "Купити в Telegram", empty: "Товари не знайдені" },
            en: { heading: "Settings", filterTitle: "Product Filter", lang: "Language:", theme: "Dark Theme:", curr: "Currency:", grid: "Grid:", buy: "Buy in Telegram", empty: "No products found" }
        };

        const subtypesData = {
            clothes: ['Штаны', 'Худи / Свитшоты', 'Куртки / Ветровки', 'Футболки', 'Шорты'],
            shoes: ['Кроссовки', 'Кеды', 'Ботинки', 'Тапочки'],
            accessories: ['Сумки / Рюкзаки', 'Кепки / Шапки', 'Носки', 'Другое']
        };

        function openFilters() { document.getElementById('filtersModal').style.display = 'flex'; }
        function closeFilters() { document.getElementById('filtersModal').style.display = 'none'; }

        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        function updateSubtypeFilter() {
            const type = document.getElementById('typeFilter').value;
            const subSelect = document.getElementById('subtypeFilter');
            subSelect.innerHTML = '<option value="all">Все подкатегории</option>';
            if (type !== 'all' && subtypesData[type]) {
                subtypesData[type].forEach(s => {
                    subSelect.innerHTML += `<option value="${s}">${s}</option>`;
                });
            }
        }

        function resetFilters() {
            document.getElementById('searchSkutitle').value = '';
            document.getElementById('typeFilter').value = 'all';
            document.getElementById('subtypeFilter').value = 'all';
            document.getElementById('brandFilter').value = 'all';
            document.getElementById('sizeFilter').value = '';
            document.getElementById('priceFrom').value = '';
            document.getElementById('priceTo').value = '';
            updateSubtypeFilter();
            loadProducts();
        }

        function toggleTheme() {
            const isDark = document.getElementById('themeToggle').checked;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            const t = translations[lang];
            document.getElementById('setHeading').innerText = t.heading;
            document.getElementById('lblFilterTitle').innerText = t.filterTitle;
            document.getElementById('lblLang').innerText = t.lang;
            document.getElementById('lblTheme').innerText = t.theme;
            document.getElementById('lblCurrency').innerText = t.curr;
            document.getElementById('lblGrid').innerText = t.grid;
            loadProducts();
        }

        function changeGrid() {
            const val = document.getElementById('gridSelect').value;
            const root = document.documentElement;
            if (val === 'large') root.style.setProperty('--grid-cols', 'repeat(auto-fill, minmax(320px, 1fr))');
            else if (val === 'small') root.style.setProperty('--grid-cols', 'repeat(auto-fill, minmax(180px, 1fr))');
            else root.style.setProperty('--grid-cols', 'repeat(auto-fill, minmax(230px, 1fr))');
        }

        function toggleFav(id) {
            if (favorites.includes(id)) favorites = favorites.filter(item => item !== id);
            else favorites.push(id);
            localStorage.setItem('favs', JSON.stringify(favorites));
            updateFavBtn();
            loadProducts();
        }

        function updateFavBtn() {
            document.getElementById('favToggleBtn').innerText = `❤️ Избранное (${favorites.length})`;
        }

        function toggleFavFilter() {
            showOnlyFavs = !showOnlyFavs;
            document.getElementById('favToggleBtn').style.background = showOnlyFavs ? '#ef4444' : '';
            loadProducts();
        }

        async function loadProducts() {
            const container = document.getElementById('productsContainer');
            const search = document.getElementById('searchSkutitle').value.toLowerCase().trim();
            const type = document.getElementById('typeFilter').value;
            const subtype = document.getElementById('subtypeFilter').value;
            const brand = document.getElementById('brandFilter').value;
            const size = document.getElementById('sizeFilter').value.toUpperCase().trim();
            const priceFrom = parseFloat(document.getElementById('priceFrom').value) || 0;
            const priceTo = parseFloat(document.getElementById('priceTo').value) || Infinity;
            const currency = document.getElementById('currencySelect').value;
            const lang = document.getElementById('langSelect').value;

            let { data, error } = await supabaseClient.from('products').select('*');

            if (error || !data) {
                container.innerHTML = `<p>${translations[lang].empty}</p>`;
                return;
            }

            // Фильтрация
            data = data.filter(item => {
                if (showOnlyFavs && !favorites.includes(item.id)) return false;
                if (type !== 'all' && item.category !== type) return false;
                if (subtype !== 'all' && item.subtype !== subtype) return false;
                if (brand !== 'all' && item.brand !== brand) return false;
                if (search && !(item.title.toLowerCase().includes(search) || (item.sku && item.sku.toLowerCase().includes(search)))) return false;
                if (size && (!item.sizes || !item.sizes.includes(size))) return false;
                if (item.price < priceFrom || item.price > priceTo) return false;
                return true;
            });

            if (data.length === 0) {
                container.innerHTML = `<p>${translations[lang].empty}</p>`;
                return;
            }

            // Конвертация валюты
            let rate = 1, symbol = '₴';
            if (currency === 'USD') { rate = 0.024; symbol = '$'; }
            if (currency === 'EUR') { rate = 0.022; symbol = '€'; }

            container.innerHTML = data.map(item => {
                const isFav = favorites.includes(item.id);
                const displayPrice = Math.round((item.price || 0) * rate);

                return `
                    <div class="card">
                        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFav(${item.id})">♥</button>
                        <img src="${item.image_url}" alt="${item.title}">
                        <div class="card-body">
                            <div class="card-sku">Арт: ${item.sku || 'N/A'}</div>
                            <div class="card-title">${item.title}</div>
                            <div class="card-price">${displayPrice} ${symbol}</div>
                            <div class="card-info"><b>Размеры:</b> ${item.sizes ? item.sizes.join(', ') : 'Н/Д'}</div>
                            <div class="card-info"><b>Бренд:</b> ${item.brand || '—'}</div>
                            <a href="${item.tg_link}" target="_blank" class="btn-buy">${translations[lang].buy}</a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        updateFavBtn();
        loadProducts();
    </script>
</body>
</html>
